   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'" transform="translate(7.2 280.215234)">30-minute recovery confirmation | P1 retrospective inferred-network cohort | test n = 3,933</text>
   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'" transform="translate(7.2 290.297531)">All three use F3 + the same 12 S1 summary fields, not full F7. Fixed threshold 0.5.</text>
   <text style="font-size: 8.4px; font-family: 'DejaVu Sans'" transform="translate(7.2 300.379828)">Geographic neighbors observed for 67.2% of test events versus 100% directed/pooled; missingness is retained.</text>
